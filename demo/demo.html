<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détecteur de fraude </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#11151c; --ink-800:#1b222c; --ink-700:#262f3b; --ink-600:#333e4c;
    --text-hi:#edeee9; --text-dim:#98a2ab; --text-faint:#6b7580;
    --signal-red:#d6432f; --signal-red-soft:#f0a08f;
    --signal-amber:#e8a33c; --signal-amber-soft:#f3c98a;
    --signal-teal:#2f8f7a; --signal-teal-soft:#8fc4b6;
    --steel:#5b7a9d;
    --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    --font-body:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--ink-900); color:var(--text-hi); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  .root{ max-width:1180px; margin:0 auto; padding:28px 20px 40px; }

  .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--signal-amber); margin:0 0 6px; }
  h1{ font-family:var(--font-display); font-weight:700; font-size:clamp(22px,3.4vw,32px); margin:0 0 6px; letter-spacing:-.01em; }
  .subhead{ color:var(--text-dim); font-size:14px; margin:0 0 16px; max-width:680px; line-height:1.5;}
  .subhead b{ color:var(--text-hi); font-weight:500; }

  .governance{
    background:rgba(232,163,60,.10); border:1px solid rgba(232,163,60,.35); border-left:3px solid var(--signal-amber);
    border-radius:8px; padding:10px 14px; font-size:12.5px; color:var(--text-hi); margin-bottom:18px; line-height:1.5;
  }
  .caveat{
    background:rgba(214,67,47,.08); border:1px solid rgba(214,67,47,.3); border-left:3px solid var(--signal-red);
    border-radius:8px; padding:10px 14px; font-size:12.5px; color:var(--text-hi); margin-bottom:18px; line-height:1.5;
  }

  .kpi-strip{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:20px; }
  .kpi{ background:var(--ink-800); border:1px solid var(--ink-600); border-radius:10px; padding:12px 14px; position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--steel); }
  .kpi.warn::before{ background:var(--signal-amber); }
  .kpi-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin-bottom:5px;}
  .kpi-value{ font-family:var(--font-mono); font-size:19px; font-weight:600; color:var(--text-hi); }

  .layout{ display:grid; grid-template-columns:1.4fr 1fr; gap:18px; align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } }

  .panel{ background:var(--ink-800); border:1px solid var(--ink-600); border-radius:14px; padding:18px 18px 20px; }
  .panel h2{ font-family:var(--font-display); font-size:15px; font-weight:600; margin:0 0 4px; color:var(--text-hi); }
  .panel .panel-sub{ font-size:12px; color:var(--text-dim); margin:0 0 14px; }

  .filters{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .chip{ font-family:var(--font-mono); font-size:11px; padding:5px 10px; border-radius:100px; border:1px solid var(--ink-600); color:var(--text-dim); cursor:pointer; background:transparent; transition:all .15s ease; }
  .chip:hover{ border-color:var(--steel); color:var(--text-hi); }
  .chip.active{ background:var(--steel); color:var(--ink-900); border-color:var(--steel); font-weight:600; }

  .ledger-scroll{ max-height:520px; overflow-y:auto; border-radius:8px; border:1px solid var(--ink-600); }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  thead th{ position:sticky; top:0; background:var(--ink-700); text-align:left; padding:9px 8px; font-family:var(--font-mono); font-weight:500; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); border-bottom:1px solid var(--ink-600); cursor:pointer; user-select:none; }
  thead th:hover{ color:var(--text-hi); }
  tbody td{ padding:7px 8px; border-bottom:1px solid var(--ink-700); font-family:var(--font-mono); }
  tbody tr{ cursor:pointer; transition:background .1s ease; }
  tbody tr:hover{ background:var(--ink-700); }
  tbody tr.selected{ background:var(--ink-600); }
  td.amount{ text-align:right; }
  td.proba{ text-align:right; font-weight:600; }
  .badge{ display:inline-block; padding:2px 7px; border-radius:5px; font-size:10px; font-weight:600; font-family:var(--font-mono); }
  .badge.fraud{ background:rgba(214,67,47,.18); color:var(--signal-red-soft); }
  .badge.legit{ background:rgba(47,143,122,.18); color:var(--signal-teal-soft); }

  .empty-state{ color:var(--text-dim); font-size:13px; text-align:center; padding:60px 20px; }
  .gauge-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom:6px; }
  .gauge-readout{ font-family:var(--font-mono); font-size:28px; font-weight:600; margin-top:-36px; }
  .gauge-sub{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; }
  .decision-line{ text-align:center; font-size:13px; margin:10px 0 16px; padding:8px; border-radius:8px; background:var(--ink-700); }
  .tx-meta{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:4px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); }
  .tx-meta b{ color:var(--text-hi); }

  .contrib-title{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:16px 0 10px; }
  .plain-line{ font-size:12.5px; line-height:1.6; margin-bottom:4px; }
  .plain-line.up{ color:var(--signal-red-soft); }
  .plain-line.down{ color:var(--signal-teal-soft); }

  .ai-btn{ width:100%; margin-top:18px; padding:11px 14px; border-radius:9px; border:none; cursor:pointer; background:var(--signal-amber); color:var(--ink-900); font-family:var(--font-body); font-weight:600; font-size:13.5px; transition:filter .15s ease; display:flex; align-items:center; justify-content:center; gap:8px; }
  .ai-btn:hover{ filter:brightness(1.08); }
  .ai-btn:disabled{ opacity:.6; cursor:wait; }
  .ai-result{ margin-top:12px; padding:13px 14px; background:var(--ink-700); border-left:3px solid var(--signal-amber); border-radius:0 8px 8px 0; font-size:13px; line-height:1.55; color:var(--text-hi); display:none; }
  .ai-source-tag{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--signal-amber); margin-bottom:6px; display:block; }
  .spinner{ width:14px; height:14px; border-radius:50%; border:2px solid rgba(17,21,28,.3); border-top-color:var(--ink-900); animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  footer{ margin-top:26px; font-size:11.5px; color:var(--text-faint); text-align:center; line-height:1.6; }
  footer a{ color:var(--text-dim); }
</style>
</head>
<body>
<div class="root">

  <p class="eyebrow">Finance &amp; risque</p>
  <h1>Détecteur de fraude carte bancaire</h1>

  <div class="kpi-strip" id="kpiStrip"></div>

  <div class="layout">
    <div class="panel">
      <h2>Registre des transactions</h2>
      <div class="filters" id="filters"></div>
      <div class="ledger-scroll">
        <table>
          <thead>
            <tr>
              <th data-sort="id">ID</th>
              <th data-sort="amount">Montant</th>
              <th data-sort="merchant_type">Commerçant</th>
              <th data-sort="device_type">Appareil</th>
              <th data-sort="true_label">Classe réelle</th>
              <th data-sort="probability">Score</th>
            </tr>
          </thead>
          <tbody id="ledgerBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="inspectorPanel">
      <h2>Rapport d'alerte</h2>
      <div id="inspectorContent"><div class="empty-state">← Sélectionnez une transaction dans le registre</div></div>
    </div>
  </div>

</div>

  ];
  document.getElementById('kpiStrip').innerHTML = items.map(([label,val],i)=>
    `<div class="kpi${i>=2?' warn':''}"><div class="kpi-label">${label}</div><div class="kpi-value">${val}</div></div>`
  ).join('');
}

function renderFilters(){
  const filters = [['all','Toutes'], ['fraud','Fraudes réelles'], ['legit','Légitimes réelles'], ['flagged','Signalées']];
  document.getElementById('filters').innerHTML = filters.map(([key,label])=>
    `<button class="chip${state.filter===key?' active':''}" data-filter="${key}">${label}</button>`
  ).join('');
  document.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{ state.filter = el.dataset.filter; renderFilters(); renderLedger(); });
  });
}

function getFilteredSorted(){
  let rows = DEMO_DATA.transactions.slice();
  if(state.filter==='fraud') rows = rows.filter(r=>r.true_label===1);
  if(state.filter==='legit') rows = rows.filter(r=>r.true_label===0);
  if(state.filter==='flagged') rows = rows.filter(r=>r.probability>=DEMO_DATA.threshold_default);
  rows.sort((a,b)=>{
    const d = state.sortDir==='asc' ? 1 : -1;
    return a[state.sortKey] > b[state.sortKey] ? d : a[state.sortKey] < b[state.sortKey] ? -d : 0;
  });
  return rows;
}

function renderLedger(){
  const rows = getFilteredSorted();
  document.getElementById('ledgerBody').innerHTML = rows.map(r=>`
    <tr data-id="${r.id}" class="${state.selectedId===r.id?'selected':''}">
      <td>#${r.id}</td>
      <td class="amount">${fmtEuro(r.amount)}</td>
      <td>${r.merchant_type}</td>
      <td>${r.device_type}</td>
      <td><span class="badge ${r.true_label===1?'fraud':'legit'}">${r.true_label===1?'Fraude':'Légitime'}</span></td>
      <td class="proba" style="color:${riskColor(r.probability)}">${fmtPct(r.probability)}</td>
    </tr>
  `).join('');
  document.querySelectorAll('#ledgerBody tr').forEach(tr=>{
    tr.addEventListener('click', ()=>{ state.selectedId = parseInt(tr.dataset.id); renderLedger(); renderInspector(); });
  });
}

document.querySelectorAll('thead th[data-sort]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.dataset.sort;
    if(state.sortKey===key) state.sortDir = state.sortDir==='asc' ? 'desc' : 'asc';
    else { state.sortKey = key; state.sortDir = 'desc'; }
    renderLedger();
  });
});

function polar(cx,cy,r,angleDeg){ const a=(angleDeg-90)*Math.PI/180; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }
function gaugeSvg(p){
  const angle = -90 + p*180, cx=110, cy=100, r=82;
  const zones = [{from:0,to:0.4,color:'var(--signal-teal)'},{from:0.4,to:0.7,color:'var(--signal-amber)'},{from:0.7,to:1.0,color:'var(--signal-red)'}];
  const arcs = zones.map(z=>{
    const a0=-90+z.from*180, a1=-90+z.to*180, p0=polar(cx,cy,r,a0), p1=polar(cx,cy,r,a1), largeArc=(a1-a0)>180?1:0;
    return `<path d="M ${p0.x} ${p0.y} A ${r} ${r} 0 ${largeArc} 1 ${p1.x} ${p1.y}" stroke="${z.color}" stroke-width="13" fill="none" opacity="0.9"/>`;
  }).join('');
  const needleEnd = polar(cx,cy,r-16,angle);
  return `<svg viewBox="0 0 220 118" width="220" height="118">${arcs}
    <line x1="${cx}" y1="${cy}" x2="${needleEnd.x}" y2="${needleEnd.y}" stroke="var(--text-hi)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="var(--text-hi)"/></svg>`;
}

function humanizeFeature(feature, value, contribution){
  const up = contribution > 0;
  if(feature === 'Transaction_Frequency') return `un nombre de transactions récentes ${up?'élevé':'peu élevé'} pour ce client (${value.toFixed(0)})`;
  if(feature === 'Location_Distance') return `une opération réalisée ${up?'loin':'près'} du lieu habituel du client (~${value.toFixed(0)} km)`;
  if(feature === 'Hour_of_Day') return `un horaire ${up?'inhabituel':'habituel'} (${Math.round(value)}h)`;
  if(feature === 'Amount_log') return `un montant ${up?'élevé':'dans la norme'} (${Math.expm1(value).toFixed(2)} €)`;
  if(feature === 'Is_International') return value>=0.5 ? "une opération réalisée à l'étranger" : "une opération réalisée dans le pays du client";
  if(feature.startsWith('Merchant_Type_')){
    const cat = feature.replace('Merchant_Type_','');
    return value>=0.5 ? `un achat chez un commerçant de catégorie « ${cat} »` : `un commerçant qui n'est pas de catégorie « ${cat} »`;
  }
  if(feature.startsWith('Device_Type_')){
    const cat = feature.replace('Device_Type_','');
    return value>=0.5 ? `une opération réalisée depuis un appareil de type « ${cat} »` : `un appareil qui n'est pas de type « ${cat} »`;
  }
  if(/^V\d+$/.test(feature)) return `un indicateur comportemental interne (${feature}) ${up?'nettement supérieur':'nettement inférieur'} au comportement habituel`;
  return `${feature} = ${value.toFixed(2)}`;
}

function renderInspector(){
  const tx = DEMO_DATA.transactions.find(t=>t.id===state.selectedId);
  if(!tx){ document.getElementById('inspectorContent').innerHTML = '<div class="empty-state">← Sélectionnez une transaction dans le registre</div>'; return; }

  const flagged = tx.probability >= DEMO_DATA.threshold_default;
  const plainLines = tx.top_features.slice(0,4).map(f=>{
    const cls = f.contribution>0 ? 'up' : 'down';
    const arrow = f.contribution>0 ? '🔺' : '🔻';
    return `<div class="plain-line ${cls}">${arrow} ${humanizeFeature(f.feature, f.value, f.contribution)}</div>`;
  }).join('');

  document.getElementById('inspectorContent').innerHTML = `
    <div class="tx-meta">
      <span>Montant <b>${fmtEuro(tx.amount)}</b></span>
      <span>Commerçant <b>${tx.merchant_type}</b></span>
      <span>Appareil <b>${tx.device_type}</b></span>
      <span>${tx.is_international ? 'International' : 'Domestique'}</span>
    </div>
    <div class="gauge-wrap">
      ${gaugeSvg(tx.probability)}
      <div class="gauge-readout" style="color:${riskColor(tx.probability)}">${fmtPct(tx.probability)}</div>
      <div class="gauge-sub">score de risque (calibré)</div>
    </div>
    <div class="decision-line" style="color:${riskColor(tx.probability)}">
      ${flagged ? '🚩 Signalée pour vérification' : '✅ Laissée passer'}
      <span style="color:var(--text-dim)"> — seuil ${fmtPct(DEMO_DATA.threshold_default)}</span>
    </div>
    <div class="contrib-title">En langage clair</div>
    ${plainLines}
    <button class="ai-btn" id="aiBtn">✨ Générer le rapport d'alerte (Claude)</button>
    <div class="ai-result" id="aiResult"></div>
  `;
  document.getElementById('aiBtn').addEventListener('click', ()=>generateAiExplanation(tx, flagged));
}

async function generateAiExplanation(tx, flagged){
  const btn = document.getElementById('aiBtn');
  const resultEl = document.getElementById('aiResult');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Rédaction en cours...';
  resultEl.style.display = 'none';

  const factorLines = tx.top_features.slice(0,5).map(f=>
    `- ${humanizeFeature(f.feature, f.value, f.contribution)} → ${f.contribution>0?'fait monter':'fait plutôt baisser'} le niveau de risque estimé`
  ).join('\n');
  const niveau = tx.probability >= 0.7 ? 'élevé' : tx.probability >= DEMO_DATA.threshold_default ? 'à surveiller' : 'faible';

  const prompt = `Tu rédiges, pour l'équipe CONFORMITÉ d'une banque (lectorat non technique), un COURT rapport d'alerte sur une transaction jugée à risque par notre système de surveillance.

RÈGLES DE TON (impératives) :
- Français, 4 à 6 phrases, comme un collègue qui explique un dossier à l'oral — pas de ton robotique.
- AUCUN jargon technique : pas de "SHAP", "modèle", "algorithme", "score calibré", "feature", "intelligence artificielle". Ne te présente jamais comme une IA.

RÈGLE DE GOUVERNANCE (impérative) :
- Ce système NE BLOQUE JAMAIS automatiquement une transaction. Ta recommandation finale doit TOUJOURS être une recommandation DE REVUE HUMAINE, jamais une action déjà prise (ne dis jamais "bloquez" ni "a été bloquée").

Dossier :
- Montant : ${tx.amount.toFixed(2)} €
- Commerçant : ${tx.merchant_type} · Appareil : ${tx.device_type} · ${tx.is_international ? 'International' : 'Domestique'}
- Niveau de risque estimé : ${niveau} (${(tx.probability*100).toFixed(0)}%)
- Statut : ${flagged ? 'SIGNALÉE pour vérification' : 'Laissée passer'}

Facteurs ayant motivé cette alerte (à reformuler naturellement, ne pas recopier en liste) :
${factorLines}

Termine par une recommandation proportionnée au niveau de risque et une phrase rappelant que c'est une estimation, pas une certitude.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 500, messages: [{ role: "user", content: prompt }] })
    });
    const data = await response.json();
    let text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    if(!text) throw new Error('Réponse vide');
    if(!text.includes('revue') && !text.includes('analyste')) text += `\n\n${RISK_NOTICE}`;
    resultEl.innerHTML = `<span class="ai-source-tag">🤖 Rédigé par Claude</span>${text.replace(/\n/g,'<br>')}`;
  }catch(err){
    resultEl.innerHTML = `<span class="ai-source-tag" style="color:var(--text-dim)">⚠️ Rapport IA indisponible</span>
      L'appel a échoué dans ce contexte (${err.message}). Dans l'application Streamlit complète, un
      générateur par règles (même ton, mêmes garanties de gouvernance) prend automatiquement le relais.`;
  }finally{
    btn.disabled = false;
    btn.innerHTML = "✨ Générer le rapport d'alerte (Claude)";
    resultEl.style.display = 'block';
  }
}

renderNotices();
renderKpis();
renderFilters();
renderLedger();
if(DEMO_DATA.transactions.length){
  state.selectedId = DEMO_DATA.transactions.find(t=>t.true_label===1)?.id ?? DEMO_DATA.transactions[0].id;
  renderLedger();
  renderInspector();
}
</script>
